# =====================================================================
#  Zola configuration — Homeowners Association website
#  Target: Zola 0.23.x (Tera 2). Older Zola versions will NOT build this.
# =====================================================================

# REQUIRED: change to your real domain (or GitHub Pages URL) before deploying.
base_url = "https://www.autumnridgedurham.com"

title = "Autumn Ridge Homeowners Association of Durham"
description = "News, events, documents, and resources for Autumn Ridge residents."
default_language = "en"

# Plain CSS lives in /static/css, so Sass is not needed.
compile_sass = false
minify_html = true

# Atom feed for News (residents can subscribe in Outlook/any RSS reader).
generate_feeds = true
feed_filenames = ["atom.xml"]

# Client-side search index (optional; off to keep it simple).
build_search_index = false

# Taxonomy used to tag news posts (e.g., "pool", "landscaping", "board").
taxonomies = [
  { name = "tags", feed = false },
]

[markdown]
# Turn "quotes" into “smart quotes”, -- into dashes, etc.
smart_punctuation = true
# Open links to external sites in a new tab and add rel="noopener".
external_links_target_blank = true
external_links_no_referrer = true

[link_checker]
# `zola check` will warn about broken internal/external links.
skip_prefixes = ["mailto:", "tel:"]

# ---------------------------------------------------------------------
#  Everything below is custom data used by the templates.
#  Edit these values — no template changes needed.
# ---------------------------------------------------------------------
[extra]
hoa_short_name = "Autumn Ridge HOA"
tagline = "A friendly, well-kept neighborhood in Durham, North Carolina."

# Contact info (shown in footer and on the Contact page)
email = "hoa@wmdouglas.com"
phone = "704-347-8900"
mailing_address = "William Douglass Management, 4523 Park Road, Suite 201A, Charlotte, NC 28209"

# Management company (leave empty strings to hide)
management_company = "William Douglass Management"
management_phone = "704-347-8900"
management_email = "hoa@wmdouglas.com"
# Link to the dues/assessment payment portal (leave empty to hide button)
payment_portal_url = "https://wdm.cincwebaxis.com/"

# Optional form endpoint (Formspree, Basin, Netlify Forms, Power Automate HTTP trigger, etc.)
# Leave empty to show a mailto: link instead of a form.
contact_form_action = ""

# Emergency / after-hours line (leave empty to hide)
emergency_note = "For after-hours common-area emergencies (water leaks, downed trees), call the management company."

copyright = "Autumn Ridge Homeowners Association"

# Top navigation. Paths use Zola internal links (@/...) so broken links fail the build.
menu = [
  { name = "Home",       path = "@/_index.md" },
  { name = "About",      path = "@/about.md" },
  { name = "News",       path = "@/news/_index.md" },
  { name = "Events",     path = "@/events/_index.md" },
  { name = "Documents",  path = "@/documents.md" },
  { name = "Requests",   path = "@/architectural-requests.md" },
  { name = "FAQ",        path = "@/faq.md" },
  { name = "Contact",    path = "@/contact.md" },
]

# Quick-link tiles on the home page
quick_links = [
  { title = "Annual Dues Information",              text = "How much are my annual dues, what is it used for, and how to pay assessments.",            path = "@/dues.md" },
  { title = "Governing Documents",   text = "Bylaws, rules, and meeting minutes.",    path = "@/documents.md" },
  { title = "Architectural Request", text = "Planning a fence, shed, or exterior change?",   path = "@/architectural-requests.md" },
]
